name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Линтер и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Статический анализ
        run: ruff check .

      - name: Проверки логики и SQL
        run: python tests/test_flow.py

      - name: Сквозные сценарии
        run: python tests/test_bot.py
