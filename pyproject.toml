[project]
name = "dating-bot"
version = "1.0.0"
description = "Телеграм-бот знакомств: живая модерация, без подписок"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP", "I", "C4", "RET", "PIE"]
ignore = [
    "E501",    # длину строк держим сами, переносы ради переносов только мешают читать
    "RET504",  # именованная переменная перед return часто понятнее
    "B008",    # вызовы в значениях по умолчанию у нас осознанные
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # тестам нужно поправить sys.path до импортов
